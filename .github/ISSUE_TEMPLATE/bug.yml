name: Bug report
description: Report a reproducible problem using sample data only.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use the public sample or invented data. Remove emails, keys, confirmations, references, and personal screenshots before submitting.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction using sample data
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no secrets, personal data, confirmations, or booking references.
          required: true
